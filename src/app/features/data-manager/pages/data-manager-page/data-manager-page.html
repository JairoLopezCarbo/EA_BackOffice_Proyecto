<section class="data-manager-page">
  <app-sidebar
    [selectedType]="selectedType()"
    [types]="typeOptions"
    (typeChange)="onTypeChange($event)"
  />

  <div class="data-manager-page__content">
    <button
      type="button"
      class="data-manager-page__logout"
      [disabled]="loggingOut()"
      (click)="onLogout()"
    >
      {{ loggingOut() ? 'Logging out...' : 'Logout' }}
    </button>

    <section class="data-manager-page__summary" aria-label="General entity count">
      <article class="data-manager-page__summary-total">
        <span class="data-manager-page__summary-label">Total records</span>
        <strong class="data-manager-page__summary-value">
          {{ entityCountsLoading() ? '...' : totalEntityCount() }}
        </strong>
      </article>

      <div class="data-manager-page__summary-grid">
        @for (item of entityCountCards(); track item.value) {
          <article
            class="data-manager-page__summary-card"
            [class.data-manager-page__summary-card--active]="selectedType() === item.value"
          >
            <span class="data-manager-page__summary-label">{{ item.label }}</span>
            <strong class="data-manager-page__summary-value">
              {{ entityCountsLoading() ? '...' : item.count }}
            </strong>
          </article>
        }
      </div>
    </section>

    @if (showSearchBar()) {
      <app-search-bar
        class="data-manager-page__search"
        [placeholder]="searchPlaceholder()"
        [value]="searchTerm()"
        [searching]="searching()"
        (valueChange)="onSearchTermChange($event)"
      />
    }

    <app-pagination
      [page]="page()"
      [limit]="limit()"
      [total]="total()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
      (limitChange)="onLimitChange($event)"
    />

    <app-data-table
      class="data-manager-page__table"
      [items]="items()"
      [previewColumns]="currentPreviewColumns()"
      [actionConfig]="currentActionConfig()"
      [showDetailsAction]="showHistoryDetailsButton()"
      [detailsActionLabel]="'View details'"
      [editableFields]="currentEditableFields()"
      [selectedIds]="selectedIds()"
      [enableSelection]="!isHistoryType()"
      [canAddItem]="canAddCurrentType()"
      [addButtonLabel]="addButtonLabel()"
      [inlineEditSavingItemId]="inlineEditSavingItemId()"
      [inlineEditCompletedItemId]="inlineEditCompletedItemId()"
      [loading]="loading()"
      (selectedIdsChange)="onSelectedIdsChange($event)"
      (deleteItem)="onDeleteItem($event)"
      (deleteMany)="onDeleteMany($event)"
      (toggleEnabled)="onToggleEnabled($event)"
      (addItemClick)="onOpenAddItem()"
      (inlineEditSubmit)="onInlineEditSubmit($event)"
      (viewDetails)="onViewHistoryDetails($event)"
    />
  </div>
</section>

<app-user-form-modal
  [open]="showUserModal()"
  [title]="modalTitle()"
  [form]="userForm()"
  [saving]="savingUser()"
  [isEditing]="isEditingUser()"
  (close)="onCloseUserModal()"
  (submit)="onSubmitUser()"
  (fieldChange)="onUserFieldChange($event.key, $event.value)"
/>

<app-route-form-modal
  [open]="showRouteModal()"
  [title]="routeModalTitle()"
  [form]="routeForm()"
  [saving]="savingRoute()"
  [isEditing]="isEditingRoute()"
  (close)="onCloseRouteModal()"
  (submit)="onSubmitRoute()"
  (fieldChange)="onRouteFieldChange($event.key, $event.value)"
/>

<app-point-form-modal
  [open]="showPointModal()"
  [title]="pointModalTitle()"
  [form]="pointForm()"
  [saving]="savingPoint()"
  [isEditing]="isEditingPoint()"
  (close)="onClosePointModal()"
  (submit)="onSubmitPoint()"
  (fieldChange)="onPointFieldChange($event.key, $event.value)"
/>

<app-history-details-modal
  [open]="showHistoryDetailsModal()"
  [item]="selectedHistoryItem()"
  (close)="onCloseHistoryDetailsModal()"
/>
